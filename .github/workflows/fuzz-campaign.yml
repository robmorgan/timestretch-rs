name: Session and Parser Campaign
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Campaign seed (u64; defaults to run id)'
        required: false
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TIMESTRETCH_FUZZ_SEED: ${{ inputs.seed || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: 'echo "campaign seed: $TIMESTRETCH_FUZZ_SEED"'
      - run: cargo test --release --all-features --test parser_robustness -- --nocapture
      - run: cargo test --release --test session_soak -- --ignored --nocapture
