# --- Public corpus (redistributable; ROADMAP Stage 7) ---
#
# Creative Commons netlabel releases hosted on the Internet Archive.
# Fetch with: scripts/fetch_public_corpus.sh (pins SHA-256 per file).
# Every license permits redistribution and derivative works (CC0 /
# CC-BY / CC-BY-SA), so stretched renders and CI artifacts are safe to
# publish with attribution.
#
# Tempo ground truth: verified 2026-07 with two independent estimators —
# the repo detector and a coherent onset-envelope Goertzel scan (all
# scored entries peak at an exact integer BPM, consistent across four
# 60 s windows; see scripts/fetch_public_corpus.sh). The two rhythmically
# ambiguous entries (swung UK garage, broken techno) were ear-verified by
