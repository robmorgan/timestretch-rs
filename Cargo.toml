[package]
name = "timestretch"
version = "0.6.0"
edition = "2021"
description = "Pure Rust audio time stretching library optimized for EDM"
license = "MIT"
rust-version = "1.82"
keywords = ["audio", "dsp", "time-stretching", "phase-vocoder", "edm"]
categories = ["multimedia::audio", "algorithms"]
readme = "README.md"
repository = "https://github.com/robmorgan/timestretch-rs"
exclude = ["samples", "optimize", "web", "desktop"]

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1.7"

[[bin]]
name = "timestretch-cli"
path = "src/cli.rs"
required-features = ["cli"]

[[example]]
name = "generate_test_audio"
path = "test_audio/generate.rs"

[features]
cli = []
qa-harnesses = []

[dev-dependencies]
toml = "0.8"
sha2 = "0.10"
hound = "3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aiff", "pcm"] }

[profile.release]
opt-level = 3
lto = true

[workspace]
exclude = ["desktop", "web"]

[[test]]
name = "benchmarks"
path = "qa/benchmarks.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "quality_benchmark"
path = "qa/quality_benchmark.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "reference_quality"
path = "qa/reference_quality.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "rubberband_comparison"
path = "qa/rubberband_comparison.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "streaming_quality"
path = "qa/streaming_quality.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "profile_quality"
path = "qa/profile_quality.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "track_analysis_qa"
path = "qa/track_analysis_qa.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "quality_gates"
path = "tests/quality_gates.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "bpm_accuracy"
path = "qa/bpm_accuracy.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "varispeed_keylock"
path = "qa/varispeed_keylock.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "engine_ab"
path = "qa/engine_ab.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "engine_keylock"
