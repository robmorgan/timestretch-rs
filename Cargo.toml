[package]
name = "timestretch"
version = "0.15.0"
edition = "2024"
description = "Pure Rust audio time stretching library optimized for EDM"
license = "MIT"
rust-version = "1.85"
keywords = ["audio", "dsp", "time-stretching", "phase-vocoder", "edm"]
categories = ["multimedia::audio", "algorithms"]
readme = "README.md"
repository = "https://github.com/robmorgan/timestretch-rs"
exclude = ["samples", "optimize", "desktop", "docs", "tools"]

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1.7"
ebur128 = "0.1.10"

[[bin]]
name = "timestretch-cli"
path = "src/cli.rs"
required-features = ["cli"]

[[example]]
name = "generate_test_audio"
path = "test_audio/generate.rs"

[[example]]
name = "stage16_audition"

[features]
cli = []
qa-harnesses = []

[dev-dependencies]
toml = "0.8"
sha2 = "0.10"
hound = "3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aiff", "pcm"] }

[profile.release]
opt-level = 3
lto = true

[workspace]
exclude = ["desktop"]

[[test]]
name = "benchmarks"
path = "qa/benchmarks.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "reference_quality"
path = "qa/reference_quality.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "rubberband_comparison"
path = "qa/rubberband_comparison.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "track_analysis_qa"
path = "qa/track_analysis_qa.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "bpm_accuracy"
path = "qa/bpm_accuracy.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "engine_ab"
path = "qa/engine_ab.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "engine_keylock"
path = "qa/engine_keylock.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "engine_transients"
path = "qa/engine_transients.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "engine_wcet"
path = "qa/engine_wcet.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "rubberband_reference_gate"
path = "qa/rubberband_reference_gate.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "engine_ab_matrix"
path = "qa/engine_ab_matrix.rs"
required-features = ["qa-harnesses"]

[[test]]
name = "wide_falsification"
path = "qa/wide_falsification.rs"
required-features = ["qa-harnesses"]

