# Standalone crate: explicitly not part of any enclosing workspace. The
# repo root excludes "desktop", but that path-based exclude fails to match
# when this checkout is nested inside another (e.g. a git worktree under
# .claude/worktrees/), so cargo would otherwise walk up and claim the
# outer repo's workspace.
[workspace]

[package]
name = "timestretch-desktop"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
timestretch = { path = ".." }
# wgpu backend (native Metal on macOS): the default glow backend presents
# through CGLFlushDrawable / OpenGL-on-Metal, which profiled as the single
# biggest CPU cost of the app.
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "pcm", "vorbis"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = "thin"

