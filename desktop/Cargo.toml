[package]
name = "timestretch-desktop"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
timestretch = { path = "..", features = ["analysis", "io"] }
# wgpu backend (native Metal on macOS): the default glow backend presents
# through CGLFlushDrawable / OpenGL-on-Metal, which profiled as the single
# biggest CPU cost of the app.
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "pcm", "vorbis"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
audio_thread_priority = { version = "0.37", default-features = false }

