[package]
name = "ab-tui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
timestretch = { path = "../.." }
cpal = "0.15"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone crate (like desktop/): the root package publishes a lean
# library; tooling with heavy UI/audio deps stays out of its graph. The
# empty workspace table keeps cargo from walking up into the root even
# inside nested git worktrees.
[workspace]
