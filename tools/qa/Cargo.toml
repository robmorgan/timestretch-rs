[package]
name = "timestretch-qa"
version = "0.16.0"
edition = "2024"
rust-version = "1.85"
publish = false
[dependencies]
cpal = "0.15"
timestretch = { path = "../..", features = ["qa"] }
timestretch-core = { path = "../../crates/timestretch-core", features = ["qa", "accelerate"] }
serde_json = "1"
[target.'cfg(target_os = "macos")'.dependencies]
timestretch-accelerate = { path = "../../crates/timestretch-accelerate" }
audio_thread_priority = { version = "0.37", default-features = false }
