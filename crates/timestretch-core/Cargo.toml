[package]
name = "timestretch-core"
version = "0.16.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "timestretch DSP kernel and native scheduling for timestretch"

[dependencies]
rustfft = "6"
serde_json = { version = "1", optional = true }

[features]
default = []
accelerate = ["dep:timestretch-accelerate"]
qa = ["dep:serde_json"]

[target.'cfg(target_os = "macos")'.dependencies]
timestretch-accelerate = { version = "0.1.0", path = "../timestretch-accelerate", optional = true }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "reference"
required-features = ["qa"]
