<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>timestretch WebAssembly example</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin: 1rem 0 0.25rem; }
      input[type="range"] { width: 100%; }
      button { margin-top: 1rem; padding: 0.5rem 1rem; font: inherit; }
      #status { margin-top: 1rem; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>timestretch in the browser</h1>
    <p>Pick an audio file, set tempo and pitch, then render and play it. Everything runs locally.</p>

    <label for="file">Audio file</label>
    <input id="file" type="file" accept="audio/*" />

    <label for="tempo">Tempo: <output id="tempo-value">1.00</output>×</label>
    <input id="tempo" type="range" min="0.5" max="2" step="0.01" value="1" />

    <label for="pitch">Pitch: <output id="pitch-value">0</output> semitones</label>
    <input id="pitch" type="range" min="-12" max="12" step="1" value="0" />

    <button id="render" disabled>Render and play</button>
    <button id="stop" disabled>Stop</button>
    <p id="status" role="status">Loading WebAssembly…</p>

    <script type="module" src="./main.js"></script>
  </body>
</html>
